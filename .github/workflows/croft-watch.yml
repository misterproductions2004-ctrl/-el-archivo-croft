
name: Croft Watch

"on":
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restaurar historial
        uses: actions/cache@v6
        with:
          path: data/croft_watch_seen.json
          key: "croft-watch-${{ github.run_id }}"
          restore-keys: |
            croft-watch-

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Croft Watch
        run: python scripts/croft_watch.py

      - name: Guardar informe
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: croft-watch-review
          path: data/pendiente_revision.md
          if-no-files-found: ignore
          retention-days: 30
