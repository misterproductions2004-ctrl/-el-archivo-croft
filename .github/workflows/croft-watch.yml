
name: Croft Watch

on:
  workflow_dispatch:
    inputs:
      initial_scan:
        description: "Repetir el escaneo histórico de los últimos 90 días"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: croft-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    name: Investigar fuentes oficiales
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Recuperar estado incremental entre ejecuciones.
      - name: Recuperar estado incremental
        uses: actions/cache@v4
        with:
          path: |
            data/croft_watch_state.json
            data/detection_history.jsonl
            data/review_queue.json
          key: croft-watch-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            croft-watch-${{ runner.os }}-

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Ejecutar Croft Watch
        id: publish
        env:
          FORCE_INITIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.initial_scan == true }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ "$FORCE_INITIAL" = "true" ]; then
            python scripts/croft_watch.py --initial
          else
            python scripts/croft_watch.py
          fi

      - name: Publicar solo si hay noticias nuevas
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html El_Archivo_Croft_V26.2_ENCICLOPEDIA_AMPLIADA.html data/latest_news.json

          if git diff --cached --quiet; then
            echo "No hay cambios publicables; no se crea ningún commit."
          else
            git commit -m "Croft Watch: publicar novedades oficiales"
            git push origin HEAD:main
          fi

      - name: Resumen de ejecución
        if: always()
        run: |
          echo "Croft Watch ha terminado."
          echo "Consulta el registro de ejecución para comprobar las fuentes y decisiones editoriales."
