
name: Croft Watch

"on":
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Crear carpeta de datos
        run: mkdir -p data

      - name: Restaurar historial
        uses: actions/cache@v5
        with:
          path: data/croft_watch_seen.json
          key: croft-watch-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            croft-watch-${{ runner.os }}-

      - name: Instalar dependencias
        run: python -m pip install requests beautifulsoup4

      - name: Ejecutar Croft Watch
        run: python scripts/croft_watch.py

      - name: Guardar informe
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: croft-watch-review
          path: data/pendiente_revision.md
          if-no-files-found: ignore
          retention-days: 30
